run:
  n_chains: 16
  n_iter: 2500
  burn_in: 500
  thin: 50
  count_move_sweeps_per_iter: 0.04
  max_count_proposals_per_iter: 220
  blocked_refresh_frequency: 25
  blocked_refresh_attempts: 8
  checkpoint_every: 250
  random_seeds: [17291, 17292, 17293, 17294, 17295, 17296, 17297, 17298, 17299, 17300, 17301, 17302, 17303, 17304, 17305, 17306]
  target_acceptance_parameter_blocks: [0.20, 0.45]
  validate_every_saved_draw: true
model:
  outcome: "MCOD G40/G41, 2019-2024"
  rurality_reference: "metro_large"
  svi_reference: "Q1_lowest"
outputs:
  hpc_root: "outputs/bayes_constrained/hpc"
tuning_configurations:
  - name: tune_01_baseline
    count_move_sweeps_per_iter: 0.04
    max_count_proposals_per_iter: 220
    blocked_refresh_frequency: 25
    blocked_refresh_attempts: 8
    block_size: 2
    move_weights: {state_year_transfer: 0.55, swap_2x2: 0.25, county_period_exploration: 0.20}
    proposal_scale_multipliers: {beta: 1.0, state: 1.0, year: 1.0, log_sigma_state: 1.0, log_sigma_year: 1.0, log_kappa: 1.0}
  - name: tune_02_more_count_moves
