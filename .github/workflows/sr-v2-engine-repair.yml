name: Scientific Reports v2 engine repair

on:
  push:
    branches:
      - scientific-reports-v2

concurrency:
  group: scientific-reports-v2-engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip sr-v2]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out v2 branch
        uses: actions/checkout@v4
        with:
          ref: scientific-reports-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy pyarrow statsmodels matplotlib openpyxl PyYAML pytest python-docx arviz

      - name: Apply idempotent engine repair
        run: |
          python scripts/sr_v2_apply_engine_patch.py
          python scripts/sr_v2_optimize_cycle_patch.py
          python scripts/sr_v2_optimize_exact_validation_patch.py

      - name: Run existing and v2 validation tests
        run: python -m pytest -q tests/test_bayes_constrained.py tests/test_sr_v2_engine.py

      - name: Generate constraint geometry
        run: python scripts/61_analyze_constraint_geometry.py

      - name: Generate exact enumerable-kernel report
        run: python scripts/62_run_exact_kernel_validation.py

      - name: Analyze full-data latent support
        run: python scripts/63_analyze_latent_support.py

      - name: Run randomized exact validation
        run: python scripts/64_run_random_exact_validation.py

      - name: Run full-data latent movement pilot
        run: python scripts/65_run_latent_movement_pilot.py

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit repaired engine and validation evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayes_constrained/model.py \
            src/bayes_constrained/sampler.py \
            src/bayes_constrained/exact_validation.py \
            outputs/scientific_reports_v2
          if git diff --cached --quiet; then
            echo "No generated repair changes to commit."
            exit 0
          fi
          git commit -m "test: update v2 validation and pilot evidence [skip sr-v2]"
          git push origin HEAD:scientific-reports-v2
