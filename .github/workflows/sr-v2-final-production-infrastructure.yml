name: Scientific Reports v2 final production infrastructure

on:
  push:
    branches:
      - scientific-reports-v2
    paths:
      - 'outputs/scientific_reports_v2/final_production_infrastructure_requested.json'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out final infrastructure request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy pyarrow statsmodels matplotlib PyYAML pytest arviz

      - name: Compile authoritative v2 production scripts
        run: |
          python -m py_compile \
            scripts/82_prepare_sr_v2_production_final.py \
            scripts/76_run_sr_v2_production_chain.py \
            scripts/77_merge_sr_v2_production.py \
            scripts/83_gate_sr_v2_production_final.py \
            scripts/84_validate_sr_v2_final_production_infrastructure.py

      - name: Validate authoritative shell and Slurm syntax
        run: |
          bash -n hpc/wahab/stage_sr_v2_to_scratch_final.sh
          bash -n hpc/wahab/sync_sr_v2_results_home.sh
          bash -n hpc/wahab/submit_sr_v2_production_final.sh
          bash -n hpc/wahab/slurm/60_sr_v2_production_chain_array.sbatch
          bash -n hpc/wahab/slurm/62_sr_v2_finalize_production_final.sbatch

      - name: Run corrected-engine and calibration tests
        run: |
          python -m pytest -q tests/test_bayes_constrained.py tests/test_sr_v2_calibration.py

      - name: Run final infrastructure audit
        continue-on-error: true
        run: python scripts/84_validate_sr_v2_final_production_infrastructure.py

      - name: Verify final infrastructure evidence
        run: |
          test -s outputs/scientific_reports_v2/final_production_infrastructure/final_production_infrastructure.json
          test -s outputs/scientific_reports_v2/final_production_infrastructure/final_production_infrastructure.md
          git diff --check

      - name: Commit final infrastructure evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/scientific_reports_v2/final_production_infrastructure
          if git diff --cached --quiet; then
            echo "No final infrastructure evidence to commit."
          else
            git commit -m "test: record final v2 production infrastructure audit [skip sr-v2] [skip tuning] [skip joint-pilot]"
            git pull --rebase origin scientific-reports-v2
            git push origin HEAD:scientific-reports-v2
          fi

      - name: Enforce final infrastructure gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('outputs/scientific_reports_v2/final_production_infrastructure/final_production_infrastructure.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          if not report.get('passed', False):
              failed = [row for row in report.get('checks', []) if not row.get('passed', False)]
              raise SystemExit(f'Final v2 infrastructure is on HOLD: {failed}')
          PY
