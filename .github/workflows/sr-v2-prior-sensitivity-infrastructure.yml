name: Scientific Reports v2 prior sensitivity infrastructure

on:
  push:
    branches:
      - scientific-reports-v2
    paths:
      - 'outputs/scientific_reports_v2/prior_sensitivity_infrastructure_requested.json'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out prior-sensitivity request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy pyarrow statsmodels matplotlib PyYAML pytest arviz

      - name: Compile prior-profile and sensitivity code
        run: |
          python -m py_compile \
            src/bayes_constrained/model.py \
            scripts/93_prepare_sr_v2_prior_sensitivity.py \
            scripts/94_run_sr_v2_prior_sensitivity_chain.py \
            scripts/95_summarize_sr_v2_prior_sensitivity.py \
            scripts/96_validate_sr_v2_prior_sensitivity_infrastructure.py

      - name: Run prior-profile and corrected-engine tests
        run: |
          python -m pytest -q \
            tests/test_sr_v2_prior_profiles.py \
            tests/test_bayes_constrained.py \
            tests/test_sr_v2_calibration.py \
            tests/test_sr_v2_spatial_diagnostics.py

      - name: Run prior-sensitivity infrastructure audit
        continue-on-error: true
        run: python scripts/96_validate_sr_v2_prior_sensitivity_infrastructure.py

      - name: Verify infrastructure evidence
        run: |
          test -s outputs/scientific_reports_v2/prior_sensitivity_infrastructure/prior_sensitivity_infrastructure.json
          test -s outputs/scientific_reports_v2/prior_sensitivity_infrastructure/prior_sensitivity_infrastructure.md
          git diff --check

      - name: Commit infrastructure evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/scientific_reports_v2/prior_sensitivity_infrastructure
          if git diff --cached --quiet; then
            echo "No prior-sensitivity infrastructure evidence to commit."
          else
            git commit -m "test: record v2 prior-sensitivity infrastructure [skip sr-v2] [skip tuning] [skip joint-pilot]"
            git pull --rebase origin scientific-reports-v2
            git push origin HEAD:scientific-reports-v2
          fi

      - name: Enforce infrastructure gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('outputs/scientific_reports_v2/prior_sensitivity_infrastructure/prior_sensitivity_infrastructure.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          if not report.get('passed', False):
              failed = [row for row in report.get('checks', []) if not row.get('passed', False)]
              raise SystemExit(f'Prior-sensitivity infrastructure is on HOLD: {failed}')
          PY
