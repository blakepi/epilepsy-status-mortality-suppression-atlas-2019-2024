name: Scientific Reports v2 production infrastructure smoke

on:
  push:
    branches:
      - scientific-reports-v2
    paths:
      - 'outputs/scientific_reports_v2/production_infrastructure_requested.json'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out infrastructure request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install smoke dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy pyarrow statsmodels matplotlib PyYAML pytest arviz

      - name: Compile v2 production scripts
        run: |
          python -m py_compile \
            scripts/75_prepare_sr_v2_production.py \
            scripts/76_run_sr_v2_production_chain.py \
            scripts/77_merge_sr_v2_production.py \
            scripts/78_gate_sr_v2_production.py \
            scripts/81_validate_sr_v2_production_infrastructure.py

      - name: Validate shell and Slurm syntax
        run: |
          bash -n hpc/wahab/sync_sr_v2_results_home.sh
          bash -n hpc/wahab/submit_sr_v2_production.sh
          bash -n hpc/wahab/slurm/60_sr_v2_production_chain_array.sbatch
          bash -n hpc/wahab/slurm/61_sr_v2_finalize_production.sbatch

      - name: Run core v2 unit tests
        run: |
          python -m pytest -q tests/test_bayes_constrained.py tests/test_sr_v2_calibration.py

      - name: Run production infrastructure audit
        run: python scripts/81_validate_sr_v2_production_infrastructure.py

      - name: Verify smoke evidence
        run: |
          test -s outputs/scientific_reports_v2/production_infrastructure_smoke/production_infrastructure_smoke.json
          test -s outputs/scientific_reports_v2/production_infrastructure_smoke/production_infrastructure_smoke.md
          git diff --check

      - name: Commit infrastructure evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/scientific_reports_v2/production_infrastructure_smoke
          if git diff --cached --quiet; then
            echo "No production-infrastructure evidence to commit."
            exit 0
          fi
          git commit -m "test: record v2 production infrastructure audit [skip sr-v2] [skip tuning] [skip joint-pilot]"
          git pull --rebase origin scientific-reports-v2
          git push origin HEAD:scientific-reports-v2
