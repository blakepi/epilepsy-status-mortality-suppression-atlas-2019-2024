name: Scientific Reports v2 extended corrected joint pilot

on:
  push:
    branches:
      - scientific-reports-v2
    paths:
      - 'outputs/scientific_reports_v2/extended_joint_pilot_ready.json'

concurrency:
  group: scientific-reports-v2-extended-joint-pilot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        chain: [1, 2, 3, 4]
    steps:
      - name: Check out frozen extended-pilot request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pilot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy pyarrow statsmodels PyYAML

      - name: Resume and extend corrected joint pilot chain
        run: python scripts/70_run_sr_v2_extended_joint_pilot_chain.py --chain-id ${{ matrix.chain }}

      - name: Upload extended chain outputs
        uses: actions/upload-artifact@v4
        with:
          name: extended-joint-pilot-chain-${{ matrix.chain }}
          path: |
            outputs/scientific_reports_v2/extended_joint_pilot/chains/chain_*
            outputs/scientific_reports_v2/extended_joint_pilot/extended_joint_pilot_chain_*_config.yaml
          if-no-files-found: error
          retention-days: 14

  summarize:
    needs: run-chain
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out frozen extended-pilot request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install summary dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy pyarrow statsmodels matplotlib PyYAML arviz

      - name: Download all extended chain artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: extended-joint-pilot-chain-*
          path: outputs/scientific_reports_v2/extended_joint_pilot
          merge-multiple: true

      - name: Summarize extended corrected joint pilot
        continue-on-error: true
        run: python scripts/71_summarize_sr_v2_extended_joint_pilot.py

      - name: Verify extended-pilot evidence
        run: |
          test -s outputs/scientific_reports_v2/extended_joint_pilot/extended_joint_summary.json
          test -s outputs/scientific_reports_v2/extended_joint_pilot/extended_joint_summary.md
          test -s outputs/scientific_reports_v2/extended_joint_pilot/recommended_production_tuning.yaml
          git diff --check

      - name: Commit compact extended-pilot evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            outputs/scientific_reports_v2/extended_joint_pilot/extended_joint_acceptance.csv \
            outputs/scientific_reports_v2/extended_joint_pilot/extended_joint_acceptance_summary.csv \
            outputs/scientific_reports_v2/extended_joint_pilot/extended_joint_chain_status.csv \
            outputs/scientific_reports_v2/extended_joint_pilot/extended_joint_latent_movement.csv \
            outputs/scientific_reports_v2/extended_joint_pilot/extended_joint_latent_summary_diagnostics.csv \
            outputs/scientific_reports_v2/extended_joint_pilot/extended_joint_parameter_diagnostics.csv \
            outputs/scientific_reports_v2/extended_joint_pilot/extended_joint_primary_estimates.csv \
            outputs/scientific_reports_v2/extended_joint_pilot/extended_joint_summary.json \
            outputs/scientific_reports_v2/extended_joint_pilot/extended_joint_summary.md \
            outputs/scientific_reports_v2/extended_joint_pilot/recommended_production_tuning.yaml
          if git diff --cached --quiet; then
            echo "No extended-pilot evidence to commit."
          else
            git commit -m "test: record extended corrected joint pilot [skip sr-v2] [skip tuning] [skip joint-pilot]"
            git pull --rebase origin scientific-reports-v2
            git push origin HEAD:scientific-reports-v2
          fi

      - name: Enforce extended-pilot gate after evidence is committed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('outputs/scientific_reports_v2/extended_joint_pilot/extended_joint_summary.json')
          summary = json.loads(path.read_text(encoding='utf-8'))
          if not summary.get('pilot_pass', False):
              raise SystemExit('Extended corrected joint pilot is on HOLD; evidence was committed for diagnosis.')
          PY
