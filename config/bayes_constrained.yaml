  fixed_effect_prior_sd: 1.5
  intercept_prior_sd: 5.0
  sigma_state_prior_sd: 1.0
  sigma_year_prior_sd: 1.0
  log_kappa_prior_mean: 2.302585092994046
  log_kappa_prior_sd: 1.5
outputs:
  posterior_draw_batch: "outputs/bayes_constrained/posterior_draws_primary.npz"
  posterior_parameter_draws: "outputs/bayes_constrained/posterior_parameter_draws.csv"
