run:
  n_chains: 4
  n_iter: 40000
  burn_in: 10000
  thin: 10
  count_move_sweeps_per_iter: 1
  blocked_refresh_frequency: 25
  random_seeds: [17291, 17292, 17293, 17294]
  target_acceptance_parameter_blocks: [0.20, 0.45]
  max_runtime_hours: 12
  max_count_proposals_per_iter: 750
quick_test:
  n_iter: 80
  burn_in: 20
  thin: 5
  count_move_sweeps_per_iter: 0.05
  max_count_proposals_per_iter: 120
