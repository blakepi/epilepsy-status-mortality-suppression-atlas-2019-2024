  merged_spatial_draws: {path: draws_spatial.npz, format: npz_float64, arrays: [structured, unstructured]}
  diagnostics: {format: csv_and_json, required: [parameter, r_hat, ess_bulk, ess_tail, arviz_version, constraint_failures]}
  county_effect_summary: {format: csv, required: [county_fips, component_id, singleton, structured_mean, unstructured_mean, combined_mean, combined_lower_95, combined_upper_95, r_hat, ess_bulk, ess_tail]}
  comparison_candidate: {path: primary_vs_spatial.candidate.csv, format: csv_lf, exact_rows: 8}
  independent_verification: {path: independent_spatial_sensitivity_verification.json, format: json, required: [passed, source_checks, graph_checks, chain_checks, diagnostic_checks, comparison_checks, protected_tree_checks]}
  release_manifest: {format: json, required: [artifacts, planned_outputs], planned_final: primary_vs_spatial.csv}
  gate: {path: spatial_sensitivity_gate.json, format: json, required: [passed, action, submission_authorized, interpretation_boundary, final_comparison_sha256]}

release:
