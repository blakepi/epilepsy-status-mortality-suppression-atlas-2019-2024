    - primary_rurality_nonmetro_adjacent
    - primary_rurality_nonmetro_nonadjacent
    - svi_quartile_Q2
    - svi_quartile_Q3
    - svi_quartile_Q4_highest
    - z_pct_age65
    - z_pct_male
  fields: [parameter, scale, primary_mean, primary_lower_95, primary_upper_95, spatial_mean, spatial_lower_95, spatial_upper_95, absolute_change, relative_change, interval_overlap]
  scale_by_row:
    primary_rurality_metro_other: incidence_rate_ratio
    primary_rurality_nonmetro_adjacent: incidence_rate_ratio
    primary_rurality_nonmetro_nonadjacent: incidence_rate_ratio
    svi_quartile_Q2: incidence_rate_ratio
    svi_quartile_Q3: incidence_rate_ratio
    svi_quartile_Q4_highest: incidence_rate_ratio
    z_pct_age65: standardized_log_rate_coefficient
    z_pct_male: standardized_log_rate_coefficient
  spatial_draw_transform:
    incidence_rate_ratio: draw_wise_exp_then_summarize
    standardized_log_rate_coefficient: identity_then_summarize
  absolute_change: spatial_mean_minus_primary_mean
  relative_change: absolute_change_divided_by_abs_primary_mean_fail_if_zero_or_nonfinite
  interval_overlap: max_lower_less_than_or_equal_to_min_upper_closed_intervals
  serialization:
    encoding: utf-8
    delimiter: ","
    line_ending: LF
    terminating_newline: true
    float_format: ".17g"
    boolean_format: lowercase_true_false
    header_order: [parameter, scale, primary_mean, primary_lower_95, primary_upper_95, spatial_mean, spatial_lower_95, spatial_upper_95, absolute_change, relative_change, interval_overlap]
    candidate_verifier_final_bytes: byte_identical
  pass_criteria_exclusions: [effect_direction, attenuation, interval_overlap, phi_structured_value]

thresholds:
