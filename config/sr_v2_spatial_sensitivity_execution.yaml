canonical_serialization:
  county_order_record: "<fips>\\n"
  edge_list_record: "<min_fips>|<max_fips>\\n"
  component_table: {encoding: UTF-8, delimiter: comma, line_ending: LF}
  json: {sort_keys: true, separators: [",", ":"], ensure_ascii: true, allow_nan: false, trailing_newline: false}
  component_scale_encoding: float.hex
  file_manifest_hashing: raw_file_bytes_sha256

graph_certificate:
  graph_type: binary_symmetric_unweighted_icar
  county_order: sorted_zero_padded_five_digit_model_frame_fips
  edge_order: deduplicated_lexicographic_min_max_pairs
  nodes: 3142
  undirected_edges: 9233
  components: 18
  nonisolated_nodes: 3128
  county_order_sha256: 250417302ddfc261014e7182e065ff0ebaef3a15437c8672fc05b9ab4a9c066b
  edge_list_sha256: 59412bc9722a119487977065892db16d6bb6931725821a0adb21886ec891df39
  non_singleton_components:
    - {minimum_fips: "01001", size: 3099, scale_hex: "0x1.23688b75b9ac1p-1"}
    - {minimum_fips: "02013", size: 17, scale_hex: "0x1.fdba0c05e631ep-2"}
    - {minimum_fips: "02100", size: 10, scale_hex: "0x1.00888ae534b68p-1"}
    - {minimum_fips: "15005", size: 2, scale_hex: "0x1.ffffffffffffep-3"}
  singletons:
    - "02261"
    - "02270"
    - "09001"
    - "09003"
    - "09005"
    - "09007"
    - "09009"
    - "09011"
    - "09013"
    - "09015"
    - "15001"
    - "15003"
    - "15007"
    - "46113"
  archived_geography_limitation: The model retains eight legacy Connecticut counties while the archived 2024 Census adjacency uses planning regions; no silent crosswalk is applied and the affected legacy counties remain structured-effect singletons.
  legacy_connecticut_counties: ["09001", "09003", "09005", "09007", "09009", "09011", "09013", "09015"]
  component_scale_formula: exp(mean(log(diag(pinv(degree_minus_adjacency)))))

model:
  likelihood: negative_binomial_2
  formula: deaths ~ offset(log_population) + primary_rurality + svi_quartile + z_pct_age65 + z_pct_male + centered_state_effect + centered_year_effect + county_bym2
  county_effect: sigma_county * (sqrt(phi_structured) * u_scaled + sqrt(1 - phi_structured) * v)
  structured_precision: component_scale * (degree - binary_adjacency)
  structured_constraint: component_wise_sum_to_zero
  singleton_structured_effect: exactly_zero
  singleton_contribution: sigma_county * sqrt(1 - phi_structured) * v
  priors:
    intercept: {distribution: Normal, mean_rule: crude_national_log_rate, sd: 5.0}
    nonintercept_beta: {distribution: Normal, mean: 0.0, sd: 1.5}
    state_scale: {distribution: HalfNormal, sd: 1.0}
    year_scale: {distribution: HalfNormal, sd: 1.0}
    log_kappa: {distribution: Normal, mean: 2.302585092994046, sd: 1.5}
    sigma_county: {distribution: HalfNormal, sd: 1.0, sampled_as: log_sigma_county, transformed_jacobian: log_sigma_county}
    phi_structured: {distribution: Beta, alpha: 1.0, beta: 1.0, sampled_as: logit_phi_structured, transformed_jacobian: log_phi_plus_log_one_minus_phi}
  interpretation_boundary: Ecological model-based sensitivity only; no effect is a person-level or causal estimate.

seeds:
  chain: [74291, 74292, 74293, 74294]
  allocation_initialization: [74251, 74252, 74253, 74254]
  spatial_initialization: [74261, 74262, 74263, 74264]

execution:
  chains: 4
  initial_epoch: {extension_epoch: 0, iterations_per_chain: 180000, burn_in: 45000, thin: 30, retained_draws_per_chain: 4500}
  extension: {iterations_per_chain: 90000, burn_in: 0, thin: 30, added_draws_per_chain: 3000, requires_reviewed_fingerprinted_authorization: true, advances_all_four_completed_chains: true}
  valid_total_iterations_and_draws:
    - [180000, 4500]
    - [270000, 7500]
    - [360000, 10500]
    - [450000, 13500]
  extension_epoch_range: [0, 3]
  job_attempt_range_per_epoch: [1, 3]
  checkpoint_exit_code: 75
  draw_chunk_size: 250
  latent_schedule:
    count_move_sweeps_per_iter: 0.1
    max_count_proposals_per_iter: 350
    blocked_refresh_frequency: 25
    blocked_refresh_attempts: 12
    proposed_family_sum: [transfer, interval_transfer, interval_path, swap_2x2, cycle_swap]
  extension_forbidden_failure_classes: [source, graph, constraint, fingerprint, nonfinite_value, evidence_integrity]
  state_machine:
    prepared: [running, hold]
    running: [checkpointed, completed, failed, hold]
    checkpointed: [running, hold]
    failed: [running, hold]
    completed: [extension_authorized, merging, hold]
    extension_authorized: [running, hold]
    merging: [independent_verification, hold]
    independent_verification: [gating, hold]
    gating: [pass, hold]
    pass: []
    hold: []
  extension_state_machine:
    epoch_0_completed: [merge_if_converged, reviewed_extension_epoch_1]
    epoch_1_completed: [merge_if_converged, reviewed_extension_epoch_2]
    epoch_2_completed: [merge_if_converged, reviewed_extension_epoch_3]
    epoch_3_completed: [merge_or_hold_no_further_extension]
    authorization_fields: [from_extension_epoch, to_extension_epoch, reason_convergence_only, reviewer, reviewed_utc, prior_preparation_identity, prior_pre_gate_manifest_sha256, prior_independent_verification_sha256, prior_release_manifest_sha256, prior_gate_decision_sha256, authorization_sha256]
    continuation_rule: all_four_completed_chains_with_adaptation_frozen
  job_attempt_state_machine:
    attempt_1_incomplete: [resume_failed_or_checkpointed_as_attempt_2]
    attempt_2_incomplete: [resume_failed_or_checkpointed_as_attempt_3]
    attempt_3_incomplete: [hold_no_attempt_4]
    completed: [verify_artifact_hashes_then_idempotent_noop]
  retry_rule: Resume only failed or checkpointed indexes in the same extension epoch; never rerun a hash-verified completed chain.

parameter_updates:
  spatial_hyperparameters: {kernel: symmetric_random_walk, log_sigma_county_sd: 0.08, logit_phi_structured_sd: 0.15}
  spatial_fields: {kernel: joint_mala, target: canonical_full_log_posterior, centered_subspace_hastings_correction: exact}

mala:
  frequency_iterations: 5
  initial_epsilon_structured: 0.02
  initial_epsilon_unstructured: 0.04
  adaptation_epoch: 0
  adaptation_burn_in_end_iteration: 45000
  window_attempts: 100
  target_acceptance: 0.574
  gain_cap: 0.05
  gain_power: -0.6
  multiplier_bounds: [0.1, 5.0]
  extension_adaptation: false
  adaptation_formula: log(m_next)=clip(log(m)+min(0.05,j^-0.6)*(window_acceptance-0.574),log(0.1),log(5.0))

fingerprints:
  target_fields: [schema_id, run_id, model_id, config_sha256, input_manifest_sha256, source_manifest_sha256, model_frame_semantic_sha256, graph_contract_sha256, likelihood, prior, intercept_mean_rule, intercept_mean_float_hex, design_schema, parameter_schema, extension_epoch, extension_authorization_sha256]
